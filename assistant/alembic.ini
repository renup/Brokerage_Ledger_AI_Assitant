[alembic]
# Where this service's migration scripts live ("here" = the folder holding this file)
script_location = %(here)s/migrations
# Lets env.py import the service's code; run alembic from the repo root
prepend_sys_path = .
# The database URL is set in migrations/env.py from the service's settings, never written here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
