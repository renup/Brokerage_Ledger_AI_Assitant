[project]
name = "ask-ledger"
version = "0.1.0"
description = "Ask Ledger: a brokerage account assistant (ledger-core API, assistant API, Gradio chat page)"
requires-python = ">=3.12"

# Packages the services import directly. The lockfile (uv.lock) pins exact versions of these
# and of everything they depend on, so every machine and Docker build installs the same thing.
dependencies = [
    # "standard" adds uvicorn (the server) and other common extras
    "fastapi[standard]>=0.162",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "bcrypt>=5.0",
    "PyJWT>=2.15",
    "gradio>=6.31",
    # Tokenizer for counting tokens (the chat history budget)
    "transformers>=5.21",
    # Postgres driver; "binary" bundles its own database client library
    "psycopg[binary]>=3.2",
]

# Tools needed to develop and test, but not to run the services
[dependency-groups]
dev = [
    "pytest>=9.2",
    "jupyter>=1.1",
    "ipykernel>=7.4",
]

[tool.uv]
# This is an application, not a library we publish, so uv should not try to build it as a package
package = false
